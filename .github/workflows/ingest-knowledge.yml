# ============================================================
# ingest-knowledge.yml
# ============================================================
# Automatically uploads Knowledge/*.md documents to Azure Blob
# Storage whenever files in Knowledge/ change on the main branch.
#
# Also triggerable manually from the GitHub Actions UI via
# workflow_dispatch — useful for forced re-ingestion or testing.
#
# Authentication: GitHub Actions OIDC (Workload Identity Federation)
# ---------------------------------------------------------------
# NO secrets stored for Azure auth. Instead:
#   1. GitHub requests a short-lived OIDC token from Azure AD.
#   2. Azure AD checks: "is this github.com/<your-repo>, main branch?"
#   3. If yes, issues a token valid for ~10 minutes only.
#   4. azure/login action injects AZURE_FEDERATED_TOKEN_FILE env var.
#   5. DefaultAzureCredential in the Python script picks it up automatically.
#
# GitHub Secrets required (Settings → Secrets → Actions):
#   AZURE_STORAGE_ACCOUNT  - storage account name (aiticketstorage12)
#
# GitHub Variables required (Settings → Variables → Actions):
#   AZURE_CLIENT_ID        - App registration client ID
#   AZURE_TENANT_ID        - Azure AD tenant ID
#   AZURE_SUBSCRIPTION_ID  - Azure subscription ID
# ============================================================

name: Ingest Knowledge Documents

on:
  # Trigger automatically only when Knowledge/ .md files change on main
  push:
    branches:
      - main
    paths:
      - "Knowledge/**.md"

  # Allow manual trigger from GitHub Actions UI (e.g. forced re-ingestion)
  workflow_dispatch:

# Required for OIDC token request — GitHub needs permission to mint the token
permissions:
  id-token: write   # allows GitHub to request an OIDC JWT token
  contents: read    # allows checkout

jobs:
  ingest:
    name: Upload docs to Azure Blob Storage
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------
      # 1. Check out the repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. Authenticate to Azure using OIDC (no secret stored)
      #    azure/login exchanges the GitHub OIDC token for an
      #    Azure access token and sets AZURE_FEDERATED_TOKEN_FILE
      #    so DefaultAzureCredential works automatically.
      # --------------------------------------------------------
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------------------
      # 3. Set up Python
      # --------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------------------------------------
      # 4. Install Python dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # --------------------------------------------------------
      # 5. Run ingestion script
      #    AZURE_CLIENT_ID + AZURE_TENANT_ID tell DefaultAzureCredential
      #    which identity to use. AZURE_FEDERATED_TOKEN_FILE (set by
      #    azure/login above) provides the short-lived OIDC token.
      #    AZURE_STORAGE_ACCOUNT is the only secret needed.
      # --------------------------------------------------------
      - name: Ingest knowledge documents
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
        run: python scripts/ingest_documents.py
